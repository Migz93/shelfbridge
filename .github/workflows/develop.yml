name: Develop Docker Publish

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/migz93/shelfbridge

jobs:
  docker:
    name: Build and Publish Dev Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=ShelfBridge
            org.opencontainers.image.description=ShelfBridge reading sync bridge
            org.opencontainers.image.version=develop

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CHANNEL=develop
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published AMD64 development image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.docker-build.outputs.digest }}
          format: sarif
          output: trivy-results-amd64.sarif
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          timeout: 10m

      - name: Upload AMD64 Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results-amd64.sarif
          category: trivy-linux-amd64

      - name: Scan published ARM64 development image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.docker-build.outputs.digest }}
          format: sarif
          output: trivy-results-arm64.sarif
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          timeout: 10m
          skip-setup-trivy: true

      - name: Upload ARM64 Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results-arm64.sarif
          category: trivy-linux-arm64
