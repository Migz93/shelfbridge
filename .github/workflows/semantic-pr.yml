name: Semantic PR

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const title = event.pull_request?.title;
          const pattern = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()\r\n]+\))?!?: ([^\r\n]+)$/;
          const match = typeof title === 'string' ? pattern.exec(title) : null;
          if (!match || match[0] !== title || !match[3].trim()) {
            console.error('::error::Use a Conventional Commit PR title, e.g. feat: add search or fix(api)!: update response. Allowed types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test.');
            process.exitCode = 1;
          }
          NODE
