name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## What's Changed

  $CHANGES

  ## Docker

  - `ghcr.io/$OWNER/$REPOSITORY:latest`
  - `ghcr.io/$OWNER/$REPOSITORY:v$RESOLVED_VERSION`

categories:
  - type: pre-exclude
    when:
      label: skip-changelog
  - title: Breaking Changes
    semver-increment: major
    exclusive: true
    when:
      conventional:
        breaking: true
  - title: Features
    semver-increment: minor
    exclusive: true
    when:
      - conventional:
          type: feat
      - labels: [feature, enhancement]
  - title: Fixes
    exclusive: true
    when:
      - conventional:
          type: fix
      - labels: [fix, bug, bugfix]
  - title: Documentation
    exclusive: true
    when:
      - conventional:
          type: docs
      - labels: [documentation, docs]
  - title: Maintenance
    exclusive: true
    when:
      - conventional:
          types: [build, chore, ci, perf, refactor, revert, style, test]
      - labels: [chore, dependencies, ci, github_actions]
  - title: Other Changes
  - type: version-resolver
    semver-increment: major
    when:
      label: major

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
template-footer: |
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
